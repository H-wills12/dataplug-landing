[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[redirects]]
  from = "/howto"
  to = "/#howto"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/#blog"
  status = 200

[[redirects]]
  from = "/connect"
  to = "/#connect"
  status = 200

[[redirects]]
  from = "/pay"
  to = "/#pay"
  status = 200

[[redirects]]
  from = "/agent"
  to = "/#agent"
  status = 200

[[redirects]]
  from = "/tutorials"
  to = "/#howto"
  status = 200
